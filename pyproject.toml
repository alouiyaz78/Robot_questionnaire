[project]
name = "robot-questionnaire"
version = "0.1.0"
description = "Robot questionnaire interactif avec openAI"
authors = [
    {name = "Yazid",email = "alouiyaz78@gmail.com"}
]
license = {text = "Yazid"}
readme = "README.md"
requires-python = ">3.12"
dependencies = [
    "python-docx (>=1.2.0,<2.0.0)",
    "pypdf2 (>=3.0.1,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "openai (>=2.20.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry.scripts]
robot-qcm = "robot_questionnaire.cli:main"
